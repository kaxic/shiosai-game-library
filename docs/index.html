<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#142d2e">
  <meta name="description" content="潮彩ゲーム棚の6作品。島の開拓、ダンジョン探索、食堂経営、ブロック建築、釣りをブラウザーで遊べます。">
  <title>潮彩ゲーム棚</title>
  <link rel="icon" href="assets/gameshelf.png" type="image/png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="skip" href="#games">ゲームを選ぶ</a>
  <main class="library">
    <header class="masthead">
      <div class="identity">
        <img class="mark" src="assets/gameshelf.png" width="60" height="60" alt="">
        <div>
          <h1>潮彩ゲーム棚</h1>
          <p class="intro">表紙を選ぶと、ブラウザーで遊べます。</p>
        </div>
      </div>
      <a class="download" href="https://github.com/kaxic/shiosai-game-library/releases/download/v1.0.0/shiosai-games-windows.zip">
        <span class="download-icon" aria-hidden="true">↓</span>
        Windows版をまとめて入手
      </a>
    </header>
    <nav id="games" aria-label="ゲームを選ぶ" tabindex="-1">
      <ol class="shelf" role="list">
        <li id="A" class="entry">
          <a class="game" href="https://kaxic.github.io/shiosai-nagi-island/" aria-label="A　島の開拓と庭づくり（凪島だより）を遊ぶ">
            <div class="cover"><img src="assets/nagi-island.webp" alt="" width="960" height="540" decoding="async"></div>
            <div class="caption">
              <span class="letter" aria-hidden="true">A</span>
              <div class="names"><h2>島の開拓と庭づくり</h2><p>凪島だより</p></div>
              <span class="open-arrow" aria-hidden="true"></span>
            </div>
          </a>
        </li>
        <li id="B" class="entry">
          <a class="game" href="https://kaxic.github.io/shiosai-ember-keepers/" aria-label="B　剣と回避のダンジョンRPG（灯守の地下回廊）を遊ぶ">
            <div class="cover"><img src="assets/ember-keepers.webp" alt="" width="960" height="540" decoding="async"></div>
            <div class="caption">
              <span class="letter" aria-hidden="true">B</span>
              <div class="names"><h2>剣と回避のダンジョンRPG</h2><p>灯守の地下回廊</p></div>
              <span class="open-arrow" aria-hidden="true"></span>
            </div>
          </a>
        </li>
        <li id="C" class="entry">
          <a class="game" href="https://kaxic.github.io/shiosai-astral-labyrinth/" aria-label="C　一手ずつ進む迷宮探索（星環の迷宮）を遊ぶ">
            <div class="cover"><img src="assets/astral-labyrinth.webp" alt="" width="960" height="540" decoding="async"></div>
            <div class="caption">
              <span class="letter" aria-hidden="true">C</span>
              <div class="names"><h2>一手ずつ進む迷宮探索</h2><p>星環の迷宮</p></div>
              <span class="open-arrow" aria-hidden="true"></span>
            </div>
          </a>
        </li>
        <li id="D" class="entry">
          <a class="game" href="https://kaxic.github.io/shiosai-wheat-window/" aria-label="D　畑と料理の食堂経営（麦窓食堂）を遊ぶ">
            <div class="cover"><img src="assets/wheat-window.webp" alt="" width="960" height="540" decoding="async"></div>
            <div class="caption">
              <span class="letter" aria-hidden="true">D</span>
              <div class="names"><h2>畑と料理の食堂経営</h2><p>麦窓食堂</p></div>
              <span class="open-arrow" aria-hidden="true"></span>
            </div>
          </a>
        </li>
        <li id="E" class="entry">
          <a class="game" href="https://kaxic.github.io/shiosai-sky-garden/" aria-label="E　浮島のブロック建築（空庭ブロック工房）を遊ぶ">
            <div class="cover"><img src="assets/sky-garden.webp" alt="" width="960" height="540" decoding="async"></div>
            <div class="caption">
              <span class="letter" aria-hidden="true">E</span>
              <div class="names"><h2>浮島のブロック建築</h2><p>空庭ブロック工房</p></div>
              <span class="open-arrow" aria-hidden="true"></span>
            </div>
          </a>
        </li>
        <li id="F" class="entry">
          <a class="game" href="https://kaxic.github.io/shiosai-tide-journal/" aria-label="F　釣りと魚図鑑（潮路の釣り手帖）を遊ぶ">
            <div class="cover"><img src="assets/tide-journal.webp" alt="" width="960" height="540" decoding="async"></div>
            <div class="caption">
              <span class="letter" aria-hidden="true">F</span>
              <div class="names"><h2>釣りと魚図鑑</h2><p>潮路の釣り手帖</p></div>
              <span class="open-arrow" aria-hidden="true"></span>
            </div>
          </a>
        </li>
      </ol>
    </nav>
  </main>
</body>
</html>
